name: Android Build

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Java 17
      # ---------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ---------------------------------------------------------
      # Android SDK
      # GitHub runner already contains Android SDK.
      # We manually locate sdkmanager instead of using
      # android-actions/setup-android because it was failing
      # with the obsolete "tools" package.
      # ---------------------------------------------------------
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "Searching for sdkmanager..."

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -print \
            -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            echo "Available cmdline-tools:"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -print || true
            exit 1
          fi

          echo "Found sdkmanager:"
          echo "$SDKMANAGER"

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"

          echo "SDKMANAGER_DIR=$SDKMANAGER_DIR"

          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

          "$SDKMANAGER" --version

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses || true

          echo "Installing required Android SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK setup completed."

      # ---------------------------------------------------------
      # Gradle
      # ---------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # ---------------------------------------------------------
      # Ensure Gradle Wrapper
      # ---------------------------------------------------------
      - name: Ensure Gradle wrapper
        shell: bash
        run: |
          set -e

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper JAR not found."
            echo "Generating Gradle wrapper..."

            gradle wrapper --gradle-version 8.10.2
          fi

          chmod +x gradlew

          echo "Gradle wrapper ready."

      # ---------------------------------------------------------
      # Unit Tests
      # ---------------------------------------------------------
      - name: Unit tests
        run: ./gradlew test --stacktrace

      # ---------------------------------------------------------
      # Build Debug APK
      # ---------------------------------------------------------
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # ---------------------------------------------------------
      # Lint
      # ---------------------------------------------------------
      - name: Lint
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      # ---------------------------------------------------------
      # Prepare APK for Release
      # ---------------------------------------------------------
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_SOURCE" ]; then
            echo "ERROR: APK was not found:"
            echo "$APK_SOURCE"
            echo ""
            echo "Available APK files:"
            find app/build/outputs -type f -name "*.apk" -print || true
            exit 1
          fi

          cp "$APK_SOURCE" "release/MyLauncher.apk"

          echo "APK prepared:"
          ls -lh release/MyLauncher.apk

      # ---------------------------------------------------------
      # Upload APK Artifact
      # ---------------------------------------------------------
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MyLauncher-debug-apk
          path: release/MyLauncher.apk
          if-no-files-found: error

      # ---------------------------------------------------------
      # Upload Reports
      # ---------------------------------------------------------
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MyLauncher-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      # ---------------------------------------------------------
      # Automatic GitHub Release
      # Only for push / manual workflow.
      # Pull requests do not create releases.
      # ---------------------------------------------------------
      - name: Create Latest GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MyLauncher Latest
          body: |
            # MyLauncher Latest APK

            This release is automatically generated from the latest successful GitHub Actions build.

            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}

            ## Download

            Download `MyLauncher.apk` below and install it on your Android device.

            This `latest` release is automatically replaced by the newest successful build.
          files: |
            release/MyLauncher.apk
          prerelease: false
          make_latest: true
