
name: Android Build

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # Java 17
      # ---------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # Android SDK
      # ---------------------------------------------------------
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "Searching for sdkmanager..."

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit 2>/dev/null || true)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            find "$ANDROID_HOME" -maxdepth 4 -type f \
              -name sdkmanager -print || true
            exit 1
          fi

          echo "Found: $SDKMANAGER"

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          "$SDKMANAGER" --version

          echo "Accepting Android SDK licenses..."
          set +o pipefail
          yes | "$SDKMANAGER" --licenses || true
          set -o pipefail

          echo "Installing required Android SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK setup completed."

      # ---------------------------------------------------------
      # Gradle
      # ---------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # ---------------------------------------------------------
      # Ensure Gradle Wrapper
      # ---------------------------------------------------------
      - name: Ensure Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper JAR not found."
            echo "Generating Gradle wrapper..."

            gradle wrapper --gradle-version 8.10.2
          fi

          chmod +x gradlew

          echo "Gradle wrapper ready."

      # ---------------------------------------------------------
      # Unit Tests
      # ---------------------------------------------------------
      - name: Unit tests
        run: ./gradlew test --stacktrace

      # ---------------------------------------------------------
      # Build Debug APK
      # ---------------------------------------------------------
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # ---------------------------------------------------------
      # Lint
      # ---------------------------------------------------------
      - name: Lint
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      # ---------------------------------------------------------
      # Prepare APK
      # ---------------------------------------------------------
      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_SOURCE" ]; then
            echo "ERROR: APK not found: $APK_SOURCE"
            find app/build/outputs -type f -name "*.apk" -print || true
            exit 1
          fi

          cp "$APK_SOURCE" "release/MyLauncher.apk"

          echo "Prepared APK:"
          ls -lh release/MyLauncher.apk

      # ---------------------------------------------------------
      # Upload APK Artifact
      # ---------------------------------------------------------
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MyLauncher-debug-apk
          path: release/MyLauncher.apk
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------
      # Upload Test and Lint Reports
      # ---------------------------------------------------------
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MyLauncher-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # ---------------------------------------------------------
      # Publish Latest Release
      # Only on the default branch or manual dispatch
      # ---------------------------------------------------------
      - name: Publish Latest GitHub Release
        if: >-
          github.event_name != 'pull_request' &&
          (
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
            github.event_name == 'workflow_dispatch'
          )
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          APK="release/MyLauncher.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file missing."
            exit 1
          fi

          echo "Preparing latest release..."

          # Find the current latest release, if it exists.
          if gh release view latest --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Updating existing latest release."

            # Replace the existing APK asset.
            gh release upload latest "$APK" \
              --repo "$REPOSITORY" \
              --clobber

            # Update release notes.
            gh release edit latest \
              --repo "$REPOSITORY" \
              --title "MyLauncher Latest" \
              --notes "Automatically built from commit ${COMMIT_SHA}.

          Download MyLauncher.apk below.

          Minimum Android: 8.0 (API 26)
          Package: com.mylauncher.app"

            # Move the stable tag to this successful build.
            git tag -f latest "$COMMIT_SHA"
            git push origin refs/tags/latest --force

          else
            echo "Creating the first latest release."

            # Create the tag and release on the current commit.
            gh release create latest "$APK" \
              --repo "$REPOSITORY" \
              --target "$COMMIT_SHA" \
              --title "MyLauncher Latest" \
              --notes "Automatically built from commit ${COMMIT_SHA}.

          Download MyLauncher.apk below.

          Minimum Android: 8.0 (API 26)
          Package: com.mylauncher.app" \
              --latest
          fi

          echo "----------------------------------------"
          echo "Latest APK release step completed."
          echo "Repository: $REPOSITORY"
          echo "APK: https://github.com/${REPOSITORY}/releases/download/latest/MyLauncher.apk"
          echo "Release: https://github.com/${REPOSITORY}/releases/latest"
          echo "----------------------------------------"
